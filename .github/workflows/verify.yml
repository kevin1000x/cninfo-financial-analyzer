name: workbench-verify

# push:main plus pull_request, rather than a bare [push, pull_request]: the
# latter runs the suite twice for every commit on a branch that has an open PR.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches the Dockerfile base image and setup.py's python_requires.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      # make check never imports setup.py, so this is the only step that proves
      # the packaging metadata still parses — setup.py reads all four
      # requirements files at build time to populate install_requires and extras.
      - name: Verify the package builds
        run: python -m pip install -e . --no-deps

      # flake8 (.flake8) + mypy (mypy.ini) over src/ and api/, then pytest.
      - name: Lint, type-check and test
        run: make check

      - uses: actions/checkout@v4
        with:
          repository: kevin1000x/finaudit-agent
          ref: 85b0a6d9e0df3f98bee1b886d664772dd2f4a450
          path: .finaudit-source
          persist-credentials: false
      - name: Prepare pinned FinAudit runtime
        run: python scripts/prepare_finaudit.py --source .finaudit-source
      - name: Verify imported runtime and coverage
        run: |
          PYTHONPATH=build/finaudit/src python -c "from service.api import coverage_endpoint; code, body = coverage_endpoint(); assert code == 200; print(body)"
      - name: Verify complete image assembles
        run: docker build -t cninfo-workbench:ci .
