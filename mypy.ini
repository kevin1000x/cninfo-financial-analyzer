[mypy]
python_version = 3.12
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
allow_untyped_defs = True
ignore_missing_imports = True
follow_imports = silent
exclude = (^tests/|^examples/)
disable_error_code = import-untyped,var-annotated,assignment,return-value

# The repo-root supabase/ directory holds only migration SQL, but with namespace
# resolution on, mypy reads it as a PEP 420 module named `supabase` and reports a
# false "has no attribute create_client" on the real lazy import in
# src/financial_data_sources.py whenever the wheel is not installed. src/ and api/
# are regular packages, so nothing here needs namespace resolution.
namespace_packages = False
